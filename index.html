<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Willkommen</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            padding: 50px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
            max-width: 600px;
            animation: fadeIn 0.8s ease-in;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h1 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 2.5em;
        }

        p {
            color: #555;
            font-size: 1.2em;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .button {
            display: inline-block;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px 40px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: bold;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
        }

        .button:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }

        .info {
            margin-top: 30px;
            padding: 20px;
            background: #f5f5f5;
            border-radius: 10px;
            border-left: 4px solid #667eea;
        }

        .info p {
            font-size: 1em;
            margin: 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 Willkommen!</h1>
        <p>Ihre HTML-Seite ist erfolgreich geladen und bereit für Live Preview.</p>
        <a href="#" class="button" onclick="changeContent(); return false;">Klick mich!</a>

        <div class="info">
            <p><strong>💡 Tipp:</strong> Ändern Sie den HTML-Code und sehen Sie die Änderungen live in der Vorschau!</p>
        </div>
    </div>

    <script>
        function changeContent() {
            const container = document.querySelector('.container');
            container.innerHTML = `
                <h1>✨ Perfekt!</h1>
                <p>Die interaktive Funktionalität funktioniert einwandfrei!</p>
                <p>Live Preview ist aktiv und bereit für Ihre Entwicklung.</p>
                <a href="#" class="button" onclick="location.reload(); return false;">Zurück</a>
            `;
        }
    </script>
</body>
</html>
